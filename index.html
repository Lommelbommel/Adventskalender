<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adventskalender-Rätsel für Jori</title>

  <!-- Schriftarten laden -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Pacifico&display=swap"
    rel="stylesheet"
  >

  <style>
    /* FARBEN */

    :root {
      --blau: #00345c;
      --pink: #ed2860;
      --rot: #f52232;
      --creme: #e8ddce;
      --beere: #a51e50;

      --richtig: #88e788;
      --falsch: #ff0000;
      --antwort-schrift: #511f1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 20px;
      background-color: var(--blau);
      color: var(--creme);
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.35s, color 0.35s;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 20px;
      color: var(--pink);
      font-family: "Pacifico", cursive;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: bold;
      line-height: 1.5;
    }

    .einleitung {
      margin-bottom: 35px;
      color: var(--creme);
      font-family: "Oswald", sans-serif;
      font-size: 1.3rem;
      line-height: 1.6;
    }

    button,
    input {
      font-family: Arial, sans-serif;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 5px;
    }

    /* KALENDER */

    .kalender {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .tuerchen {
      min-height: 130px;
      padding: 20px;
      border: 2px solid var(--pink);
      border-radius: 14px;
      background-color: var(--beere);
      color: var(--creme);
      font-family: "Oswald", sans-serif;
      font-size: 2.5rem;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      transition: transform 0.2s, background-color 0.2s;
    }

    .tuerchen:hover {
      transform: translateY(-4px);
      background-color: var(--rot);
    }

    /* RÄTSELBEREICH */

    .raetselbereich {
      margin-top: 35px;
      padding: 28px 20px;
      border: 2px solid currentColor;
      border-radius: 18px;
      background-color: rgba(255, 255, 255, 0.08);
      scroll-margin-top: 20px;
    }

    #raetselTitel {
      margin-top: 0;
      font-size: 1.7rem;
    }

    #aufgabe {
      font-size: 1.35rem;
      line-height: 1.6;
      white-space: pre-line;
    }

    /* EINFACHE TEXTEINGABE */

    .eingabe-label {
      display: block;
      margin: 22px 0 10px;
    }

    input {
      min-width: 0;
      padding: 13px;
      border: 2px solid var(--beere);
      border-radius: 8px;
      background-color: var(--creme);
      color: var(--blau);
      font-size: 1.1rem;
    }

    .einzel-eingabe {
      display: block;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 16px;
      text-align: center;
    }

    .knopf {
      padding: 12px 20px;
      border: 2px solid var(--beere);
      border-radius: 8px;
      background-color: var(--creme);
      color: var(--blau);
      font-size: 1rem;
    }

    .zurueck {
      margin-top: 24px;
    }

    /* AUSWAHLFRAGEN */

    .auswahl {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 750px;
      margin: 25px auto 0;
    }

    .auswahlknopf {
      min-height: 105px;
      padding: 18px 14px;
      border: 2px solid var(--pink);
      border-radius: 12px;
      background-color: var(--creme);
      color: var(--blau);
      font-size: 1.1rem;
      line-height: 1.5;
      transition: transform 0.2s;
    }

    .auswahlknopf:hover {
      transform: translateY(-3px);
    }

    .auswahlbuchstabe {
      display: block;
      margin-bottom: 6px;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .auswahlknopf[aria-pressed="true"] {
      outline: 3px solid currentColor;
      outline-offset: -7px;
    }

    /* BEWERTUNG HINTER TÜRCHEN 24 */

    .bewertung {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .bewertung .auswahlknopf {
      min-height: 85px;
      padding: 12px;
      font-size: 2rem;
      font-weight: bold;
    }

    /* MEHRERE EINGABEFELDER */

    .mehrfach-liste {
      display: grid;
      gap: 12px;
      max-width: 650px;
      margin: 25px auto;
    }

    .eingabe-zeile {
      display: grid;
      grid-template-columns: 45px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .eingabe-zeile input {
      width: 100%;
    }

    .rechenliste {
      max-width: 450px;
    }

    .rechenliste .eingabe-zeile {
      grid-template-columns: 100px minmax(0, 1fr);
    }

    .rechenliste label {
      font-size: 1.3rem;
    }

    /* MARKIERUNG EINZELNER EINGABEFELDER */

    input.feld-falsch {
      border: 3px solid #a00000;
      background-color: #ffd0d0;
      color: #511f1a;
    }

    input.feld-richtig {
      border: 3px solid #236b2d;
      background-color: #d8f5d3;
      color: #511f1a;
    }

    /* RÜCKMELDUNG */

    #meldung {
      margin-top: 24px;
      line-height: 1.6;
    }

    .yippie {
      margin: 10px 0;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: bold;
    }

    .erfolgstext {
      font-size: 1.4rem;
      white-space: pre-line;
    }

    .erklaerung {
      max-width: 680px;
      margin: 18px auto 0;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .pause {
      max-width: 650px;
      margin: 25px auto;
      font-size: 1.7rem;
      line-height: 1.7;
    }

    /* HINTERGRUNDFARBEN NACH DER PRÜFUNG */

    body.richtig {
      background-color: var(--richtig);
      color: var(--antwort-schrift);
    }

    body.falsch {
      background-color: var(--falsch);
      color: var(--antwort-schrift);
    }

    body.richtig h1,
    body.falsch h1,
    body.richtig .einleitung,
    body.falsch .einleitung,
    body.richtig .tuerchen,
    body.falsch .tuerchen,
    body.richtig input,
    body.falsch input,
    body.richtig .knopf,
    body.falsch .knopf,
    body.richtig .auswahlknopf,
    body.falsch .auswahlknopf {
      color: var(--antwort-schrift);
    }

    /* HANDYANSICHT */

    @media (max-width: 600px) {
      body {
        padding: 25px 15px;
      }

      .kalender {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .tuerchen {
        min-height: 105px;
      }

      .auswahl {
        grid-template-columns: 1fr;
      }

      .bewertung {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }

      .bewertung .auswahlknopf {
        padding: 8px;
        min-height: 70px;
      }

      .raetselbereich {
        padding: 24px 15px;
      }

      #aufgabe {
        font-size: 1.2rem;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <h1>Adventskalender-Rätsel für Jori</h1>

    <p class="einleitung">
      Wähle ein Türchen und löse das Rätsel dahinter!
    </p>

    <div class="kalender" id="kalender"></div>

    <section
      class="raetselbereich"
      id="raetselbereich"
      aria-labelledby="raetselTitel"
      hidden
    >
      <h2 id="raetselTitel" tabindex="-1"></h2>

      <p id="aufgabe"></p>

      <!-- Hier erscheint die jeweilige Eingabe oder Auswahl. -->
      <div id="interaktion"></div>

      <div
        id="meldung"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></div>

      <button class="knopf zurueck" id="zurueck" type="button">
        Zurück zum Kalender
      </button>
    </section>
  </main>

  <script>
    /*
      DEINE ZWÖLF RÄTSEL

      typ: "eingabe"   → ein Texteingabefeld
      typ: "auswahl"   → anklickbare Antwortmöglichkeiten
      typ: "mehrfach"  → mehrere Eingabefelder
      typ: "pause"     → Nachricht ohne Rätsel
      typ: "bewertung" → fünf Felder mit einer 5

      Bei Auswahlfragen beginnt die Zählung der
      richtigen Option bei 0:
      0 = A, 1 = B, 2 = C, 3 = D.
    */

    const raetsel = {
      2: {
        typ: "eingabe",
        aufgabe: "(9 − 5) × 7 + 6 × 4 = ?",
        antworten: ["52"],
        erfolgstext:
          "Du darfst das Türchen mit dem Smiley öffnen."
      },

      4: {
        typ: "auswahl",
        aufgabe:
          "Wie viele handelsübliche 0,5-Liter-Bierdosen müsste man ungefähr aufeinanderstapeln, um die Höhe des Steglitzer Bierpinsels zu erreichen?\n\nRechne mit 17 cm pro Dose.",

        optionen: [
          "Etwa 180 Dosen",
          "Etwa 280 Dosen",
          "Etwa 420 Dosen"
        ],

        richtig: 1,

        erfolgstext: "Du hast das Rätsel gelöst!",

        erklaerung:
          "Der Bierpinsel ist 47 Meter hoch. Bei angenommen 17 cm pro Dose wären das rund 276 Dosen – also ist B am nächsten dran."
      },

      6: {
        typ: "auswahl",
        aufgabe:
          "Steglitz – was wurde hier gegründet?\n\nFür welche Universität fand 1948 im Titania-Palast die Gründungsveranstaltung statt?",

        optionen: [
          "Humboldt-Universität",
          "Technische Universität Berlin",
          "Freie Universität Berlin",
          "Universität der Künste Berlin"
        ],

        richtig: 2,

        erfolgstext:
          "Du darfst das Geschenk mit den Worten „Ach, diese Lücke, diese entsetzliche Lücke“ öffnen."
      },

      8: {
        typ: "eingabe",
        aufgabe:
          "Schreibe die 7er-Malfolge von 1 × 7 bis 10 × 7 auf.\n\nOhne Komma und Leerzeichen.",

        antworten: ["7142128354249566370"],

        erfolgstext:
          "Du darfst das Geschenk mit „7x7=feiner Sand“ öffnen."
      },

      10: {
        typ: "mehrfach",
        aufgabe:
          "Wie heißen die Stationen der U9 von Walther-Schreiber-Platz bis Westhafen?\n\nTrage alle zwölf Stationen in der richtigen Reihenfolge ein und klicke auf „Bestätigen“.",

        felder: [
          {
            label: "1.",
            antworten: ["Walther-Schreiber-Platz"]
          },
          {
            label: "2.",
            antworten: ["Friedrich-Wilhelm-Platz"]
          },
          {
            label: "3.",
            antworten: ["Bundesplatz"]
          },
          {
            label: "4.",
            antworten: ["Berliner Straße"]
          },
          {
            label: "5.",
            antworten: ["Güntzelstraße"]
          },
          {
            label: "6.",
            antworten: ["Spichernstraße"]
          },
          {
            label: "7.",
            antworten: ["Kurfürstendamm"]
          },
          {
            label: "8.",
            antworten: ["Zoologischer Garten"]
          },
          {
            label: "9.",
            antworten: ["Hansaplatz"]
          },
          {
            label: "10.",
            antworten: ["Turmstraße"]
          },
          {
            label: "11.",
            antworten: ["Birkenstraße"]
          },
          {
            label: "12.",
            antworten: ["Westhafen"]
          }
        ],

        erfolgstext:
          "Du darfst das Geschenk mit dem Wort „U9“ öffnen."
      },

      12: {
        typ: "auswahl",
        aufgabe:
          "Was sorgte auf einer der ersten kommerziellen Weihnachtskarten von 1843 für Empörung?",

        optionen: [
          "Der Weihnachtsmann trug keine Hose.",
          "Kinder wurden beim Weintrinken dargestellt.",
          "Eine Kirche stand auf dem Kopf.",
          "Die Karte enthielt Werbung für Zahnersatz."
        ],

        richtig: 1,

        erfolgstext:
          "Du darfst das Geschenk mit der Weihnachtsmütze öffnen."
      },

      14: {
        typ: "auswahl",
        aufgabe:
          "Steglitz – bitte den alten Namen!\n\nWie hieß Steglitz früher tatsächlich?",

        optionen: [
          "Stieglitz",
          "Stegelitz",
          "Steglin",
          "Stachelitz"
        ],

        richtig: 1,

        erfolgstext:
          "Du darfst das Geschenk mit dem Fragezeichen öffnen.",

        erklaerung:
          "Stegelitz. Im Zuge des Zusammenschlusses der Kolonie mit dem alten Dorf wurde daraus 1870 „Steglitz“. Ein „e“ blieb auf der Strecke."
      },

      16: {
        typ: "mehrfach",
        rechnen: true,

        aufgabe:
          "Löse die sechs Rechenaufgaben.\n\nTrage alle Ergebnisse ein und klicke auf „Bestätigen“.",

        felder: [
          {
            label: "5 × 6 =",
            antworten: ["30"]
          },
          {
            label: "9 × 3 =",
            antworten: ["27"]
          },
          {
            label: "8 × 4 =",
            antworten: ["32"]
          },
          {
            label: "7 × 6 =",
            antworten: ["42"]
          },
          {
            label: "4 × 4 =",
            antworten: ["16"]
          },
          {
            label: "9 × 8 =",
            antworten: ["72"]
          }
        ],

        erfolgstext:
          "Du darfst das Türchen mit der Katze öffnen."
      },

      18: {
        typ: "pause",
        aufgabe:
          "Heute hast du dir mal eine Pause verdient.\n\nÖffne den Stern."
      },

      20: {
        typ: "auswahl",
        aufgabe: "Wie viele Meter lang ist die Schlossstraße?",

        optionen: [
          "1,9 Kilometer",
          "2,5 Kilometer",
          "2,1 Kilometer"
        ],

        richtig: 2,

        erfolgstext:
          "Du darfst das Türchen mit dem Wort „Schloss“ öffnen."
      },

      22: {
        typ: "eingabe",
        aufgabe:
          "Welcher Wochentag war der 21.07.2026?",

        antworten: ["Dienstag"],

        erfolgstext:
          "Du darfst das Geschenk mit der „21“ öffnen."
      },

      24: {
        typ: "bewertung",
        aufgabe:
          "Bewerte das Quiz.\n\n1 ist schlecht und 5 ist superspitze.",

        optionen: ["5", "5", "5", "5", "5"],

        richtig: 4,

        erfolgstext:
          "Ist ja nur noch ein Türchen übrig."
      }
    };

    /* ELEMENTE DER WEBSEITE */

    const kalender = document.getElementById("kalender");
    const bereich = document.getElementById("raetselbereich");
    const titel = document.getElementById("raetselTitel");
    const aufgabe = document.getElementById("aufgabe");
    const interaktion = document.getElementById("interaktion");
    const meldung = document.getElementById("meldung");
    const zurueck = document.getElementById("zurueck");

    let aktuelleNummer = null;
    let letztesTuerchen = null;

    /* HILFSFUNKTIONEN */

    function farbenZuruecksetzen() {
      document.body.classList.remove("richtig", "falsch");
    }

    function normalisieren(text) {
      return String(text)
        .normalize("NFC")
        .trim()
        .toLocaleLowerCase("de-DE")
        .replace(/ß/g, "ss")
        .replace(/[‐‑‒–—−]/g, "-")
        .replace(/\s*-\s*/g, "-")
        .replace(/\s+/g, " ");
    }

    function antwortIstRichtig(eingabe, erlaubteAntworten) {
      return erlaubteAntworten.some(function (antwort) {
        return normalisieren(eingabe) === normalisieren(antwort);
      });
    }

    function knopfErstellen(text) {
      const knopf = document.createElement("button");

      knopf.type = "submit";
      knopf.className = "knopf";
      knopf.textContent = text;

      return knopf;
    }

    /* ERFOLGS- UND FEHLERMELDUNGEN */

    function erfolgAnzeigen(raetselDaten) {
      farbenZuruecksetzen();
      document.body.classList.add("richtig");
      meldung.replaceChildren();

      const jubel = document.createElement("p");
      jubel.className = "yippie";
      jubel.textContent = "YIPPIE";

      const text = document.createElement("p");
      text.className = "erfolgstext";
      text.textContent = raetselDaten.erfolgstext;

      meldung.append(jubel, text);

      if (raetselDaten.erklaerung) {
        const erklaerung = document.createElement("p");

        erklaerung.className = "erklaerung";
        erklaerung.textContent = raetselDaten.erklaerung;

        meldung.appendChild(erklaerung);
      }
    }

    function fehlerAnzeigen(text) {
      farbenZuruecksetzen();
      document.body.classList.add("falsch");

      meldung.textContent =
        text ||
        "Das ist leider noch nicht richtig. Versuch es noch einmal!";
    }

    /* DIE ZWÖLF TÜRCHEN ERSTELLEN */

    Object.keys(raetsel).forEach(function (nummer) {
      const knopf = document.createElement("button");

      knopf.type = "button";
      knopf.className = "tuerchen";
      knopf.textContent = nummer;

      knopf.setAttribute(
        "aria-label",
        "Türchen " + nummer + " öffnen"
      );

      knopf.addEventListener("click", function () {
        letztesTuerchen = knopf;
        tuerchenOeffnen(nummer);
      });

      kalender.appendChild(knopf);
    });

    /* TÜRCHEN ÖFFNEN */

    function tuerchenOeffnen(nummer) {
      aktuelleNummer = nummer;

      const daten = raetsel[nummer];

      farbenZuruecksetzen();
      meldung.replaceChildren();
      interaktion.replaceChildren();

      titel.textContent = "Türchen " + nummer;
      aufgabe.textContent = daten.aufgabe;
      aufgabe.className = "";

      if (daten.typ === "eingabe") {
        texteingabeErstellen(daten);
      }

      if (
        daten.typ === "auswahl" ||
        daten.typ === "bewertung"
      ) {
        auswahlErstellen(daten);
      }

      if (daten.typ === "mehrfach") {
        mehrfachEingabeErstellen(daten);
      }

      if (daten.typ === "pause") {
        aufgabe.className = "pause";
      }

      bereich.hidden = false;

      bereich.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      titel.focus({ preventScroll: true });
    }

    /* AUFGABEN MIT EINEM TEXTEINGABEFELD */

    function texteingabeErstellen(daten) {
      const formular = document.createElement("form");

      const label = document.createElement("label");
      label.className = "eingabe-label";
      label.htmlFor = "einzelAntwort";
      label.textContent = "Deine Antwort:";

      const eingabe = document.createElement("input");
      eingabe.type = "text";
      eingabe.id = "einzelAntwort";
      eingabe.className = "einzel-eingabe";
      eingabe.placeholder = "Antwort eingeben";
      eingabe.autocomplete = "off";
      eingabe.required = true;

      const knopf = knopfErstellen("Antwort prüfen");

      formular.append(label, eingabe, knopf);

      formular.addEventListener("submit", function (ereignis) {
        ereignis.preventDefault();

        if (antwortIstRichtig(eingabe.value, daten.antworten)) {
          erfolgAnzeigen(daten);
        } else {
          fehlerAnzeigen();
          eingabe.focus();
          eingabe.select();
        }
      });

      interaktion.appendChild(formular);
    }

    /* AUSWAHLFRAGEN UND BEWERTUNG */

    function auswahlErstellen(daten) {
      const auswahl = document.createElement("div");

      auswahl.className = "auswahl";
      auswahl.setAttribute("role", "group");

      auswahl.setAttribute(
        "aria-label",
        daten.typ === "bewertung"
          ? "Bewertung auswählen"
          : "Antwort auswählen"
      );

      if (daten.typ === "bewertung") {
        auswahl.classList.add("bewertung");
      }

      daten.optionen.forEach(function (option, index) {
        const knopf = document.createElement("button");

        knopf.type = "button";
        knopf.className = "auswahlknopf";
        knopf.setAttribute("aria-pressed", "false");

        if (daten.typ === "bewertung") {
          knopf.textContent = option;

          knopf.setAttribute(
            "aria-label",
            "5 – Auswahlfeld " + (index + 1)
          );
        } else {
          const buchstabe = document.createElement("span");

          buchstabe.className = "auswahlbuchstabe";
          buchstabe.textContent =
            String.fromCharCode(65 + index) + ")";

          const text = document.createElement("span");
          text.textContent = option;

          knopf.append(buchstabe, text);
        }

        knopf.addEventListener("click", function () {
          auswahl.querySelectorAll("button").forEach(
            function (andererKnopf) {
              andererKnopf.setAttribute(
                "aria-pressed",
                "false"
              );
            }
          );

          knopf.setAttribute("aria-pressed", "true");

          if (index === daten.richtig) {
            erfolgAnzeigen(daten);
          } else {
            fehlerAnzeigen();
          }
        });

        auswahl.appendChild(knopf);
      });

      interaktion.appendChild(auswahl);
    }

    /* AUFGABEN MIT MEHREREN EINGABEFELDERN */

    function mehrfachEingabeErstellen(daten) {
      const formular = document.createElement("form");

      const liste = document.createElement("div");
      liste.className = "mehrfach-liste";

      if (daten.rechnen) {
        liste.classList.add("rechenliste");
      }

      const eingaben = [];

      daten.felder.forEach(function (feld, index) {
        const zeile = document.createElement("div");
        zeile.className = "eingabe-zeile";

        const id =
          "tuer-" + aktuelleNummer + "-feld-" + index;

        const label = document.createElement("label");
        label.htmlFor = id;
        label.textContent = feld.label;

        const eingabe = document.createElement("input");

        eingabe.id = id;
        eingabe.type = "text";
        eingabe.autocomplete = "off";
        eingabe.required = true;

        if (daten.rechnen) {
          eingabe.inputMode = "numeric";
          eingabe.placeholder = "Ergebnis";
        } else {
          eingabe.placeholder = "Station " + (index + 1);
        }

        /*
          Beim Korrigieren wird die alte Markierung
          dieses Feldes entfernt.
        */
        eingabe.addEventListener("input", function () {
          eingabe.classList.remove(
            "feld-falsch",
            "feld-richtig"
          );

          eingabe.removeAttribute("aria-invalid");
        });

        eingaben.push(eingabe);
        zeile.append(label, eingabe);
        liste.appendChild(zeile);
      });

      const knopf = knopfErstellen("Bestätigen");

      formular.append(liste, knopf);

      formular.addEventListener("submit", function (ereignis) {
        ereignis.preventDefault();

        let anzahlFehler = 0;
        let erstesFalschesFeld = null;

        eingaben.forEach(function (eingabe, index) {
          const feld = daten.felder[index];

          const istRichtig = antwortIstRichtig(
            eingabe.value,
            feld.antworten
          );

          eingabe.classList.toggle(
            "feld-richtig",
            istRichtig
          );

          eingabe.classList.toggle(
            "feld-falsch",
            !istRichtig
          );

          eingabe.setAttribute(
            "aria-invalid",
            String(!istRichtig)
          );

          if (!istRichtig) {
            anzahlFehler++;

            if (!erstesFalschesFeld) {
              erstesFalschesFeld = eingabe;
            }
          }
        });

        if (anzahlFehler === 0) {
          erfolgAnzeigen(daten);
        } else {
          const text = anzahlFehler === 1
            ? "Ein Eintrag ist noch nicht richtig. Korrigiere das rot markierte Feld und klicke erneut auf „Bestätigen“."
            : anzahlFehler +
              " Einträge sind noch nicht richtig. Korrigiere die rot markierten Felder und klicke erneut auf „Bestätigen“.";

          fehlerAnzeigen(text);
          erstesFalschesFeld.focus();
        }
      });

      interaktion.appendChild(formular);
    }

    /* ZURÜCK ZUM KALENDER */

    zurueck.addEventListener("click", function () {
      farbenZuruecksetzen();
      bereich.hidden = true;

      if (letztesTuerchen) {
        letztesTuerchen.focus();
      }
    });
  </script>
</body>
</html>
