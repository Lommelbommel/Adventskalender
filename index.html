<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adventskalender-Rätsel für Jori</title>

  <style>
    /* FARBEN UND ALLGEMEINES DESIGN */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 20px;
      background-color: #102449;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.4s, color 0.4s;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 20px;
      color: #ff9999;
      font-family: "Vivaldi", "Brush Script MT", cursive;
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      font-weight: normal;
    }

    .einleitung {
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* DIE GELBEN TÜRCHEN */

    .kalender {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .tuerchen {
      min-height: 130px;
      padding: 20px;
      border: 2px solid #ffeaa0;
      border-radius: 14px;
      background-color: #ffd65a;
      color: #102449;
      font-family: Courier, "Courier New", monospace;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #b78b20;
      transition: transform 0.2s;
    }

    .tuerchen:hover {
      transform: translateY(-4px);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #ff9999;
      outline-offset: 5px;
    }

    /* DER BEREICH MIT DEM RÄTSEL */

    .raetselbereich {
      margin-top: 35px;
      padding: 28px 20px;
      border: 2px solid currentColor;
      border-radius: 18px;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .raetselbereich h2 {
      margin-top: 0;
    }

    #aufgabe {
      font-size: 1.5rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    label {
      display: block;
      margin: 22px 0 10px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 16px;
      padding: 13px;
      border: 2px solid #102449;
      border-radius: 8px;
      background-color: #ffffff;
      color: #102449;
      font-size: 1.2rem;
      text-align: center;
    }

    .knopf {
      padding: 12px 20px;
      border: 2px solid #102449;
      border-radius: 8px;
      background-color: #ffd65a;
      color: #102449;
      font-size: 1rem;
      cursor: pointer;
    }

    .zurueck {
      margin-top: 20px;
    }

    #meldung {
      margin-top: 24px;
      line-height: 1.6;
    }

    .yippie {
      margin: 10px 0;
      font-family: Courier, "Courier New", monospace;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: bold;
    }

    .erfolgstext {
      font-size: 1.4rem;
    }

    /* DIE GANZE SEITE ÄNDERT IHRE FARBE */

    body.richtig {
      background-color: #c9efbd;
      color: #102449;
    }

    body.falsch {
      background-color: #ffc4c4;
      color: #102449;
    }

    body.richtig h1,
    body.falsch h1 {
      color: #102449;
    }

    /* AUF KLEINEN BILDSCHIRMEN: ZWEI TÜRCHEN PRO REIHE */

    @media (max-width: 600px) {
      .kalender {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .tuerchen {
        min-height: 105px;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <h1>Adventskalender-Rätsel für Jori</h1>

    <p class="einleitung">
      Wähle ein Türchen und löse das Rätsel dahinter!
    </p>

    <!-- Die Türchen werden automatisch eingefügt. -->
    <div class="kalender" id="kalender"></div>

    <section
      class="raetselbereich"
      id="raetselbereich"
      aria-labelledby="raetselTitel"
      hidden
    >
      <h2 id="raetselTitel" tabindex="-1"></h2>

      <p id="aufgabe"></p>

      <form id="antwortFormular" hidden>
        <label for="antwort">Deine Antwort:</label>

        <input
          type="text"
          id="antwort"
          placeholder="Antwort eingeben"
          autocomplete="off"
          required
        >

        <button class="knopf" type="submit">
          Antwort prüfen
        </button>
      </form>

      <div id="meldung" role="status" aria-live="polite"></div>

      <button class="knopf zurueck" id="zurueck" type="button">
        Zurück zum Kalender
      </button>
    </section>
  </main>

  <script>
    /*
      HIER KANNST DU SPÄTER DEINE RÄTSEL ÄNDERN.

      aufgabe = Was soll Jori lösen?
      antwort = Welche Antwort ist richtig?
      erfolgstext = Was erscheint nach der richtigen Antwort?

      null bedeutet: Es ist noch keine Antwort eingetragen.
    */

    const raetsel = {
      2: {
        aufgabe: "(9 − 5) × 7 + 6 × 4 = ?",
        antwort: "52",
        erfolgstext: "Du darfst das Türchen mit dem Smiley öffnen."
      },

      4: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      6: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      8: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      10: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      12: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      14: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      16: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      18: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      20: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      22: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      },

      24: {
        aufgabe: "Hier wartet bald dein nächstes Rätsel!",
        antwort: null,
        erfolgstext: "Du hast das Rätsel gelöst!"
      }
    };

    /* AB HIER MUSST DU FÜR NEUE RÄTSEL NICHTS ÄNDERN. */

    const kalender = document.getElementById("kalender");
    const bereich = document.getElementById("raetselbereich");
    const titel = document.getElementById("raetselTitel");
    const aufgabe = document.getElementById("aufgabe");
    const formular = document.getElementById("antwortFormular");
    const antwortFeld = document.getElementById("antwort");
    const meldung = document.getElementById("meldung");
    const zurueck = document.getElementById("zurueck");

    let aktuelleNummer = null;
    let letztesTuerchen = null;

    function farbenZuruecksetzen() {
      document.body.classList.remove("richtig", "falsch");
    }

    function normalisieren(text) {
      return String(text).trim().toLocaleLowerCase("de-DE");
    }

    /* Für jedes Rätsel wird ein gelbes Türchen erstellt. */
    Object.keys(raetsel).forEach(function (nummer) {
      const knopf = document.createElement("button");

      knopf.type = "button";
      knopf.className = "tuerchen";
      knopf.textContent = nummer;
      knopf.setAttribute("aria-label", "Türchen " + nummer + " öffnen");

      knopf.addEventListener("click", function () {
        letztesTuerchen = knopf;
        tuerchenOeffnen(nummer);
      });

      kalender.appendChild(knopf);
    });

    function tuerchenOeffnen(nummer) {
      aktuelleNummer = nummer;
      const aktuellesRaetsel = raetsel[nummer];

      farbenZuruecksetzen();

      titel.textContent = "Türchen " + nummer;
      aufgabe.textContent = aktuellesRaetsel.aufgabe;
      antwortFeld.value = "";
      meldung.replaceChildren();

      formular.hidden = aktuellesRaetsel.antwort === null;
      bereich.hidden = false;

      bereich.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      titel.focus({ preventScroll: true });
    }

    /* Ein Klick auf „Antwort prüfen“ oder Enter prüft die Eingabe. */
    formular.addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();

      const aktuellesRaetsel = raetsel[aktuelleNummer];
      const eingabe = normalisieren(antwortFeld.value);
      const loesung = normalisieren(aktuellesRaetsel.antwort);

      farbenZuruecksetzen();
      meldung.replaceChildren();

      if (eingabe === loesung) {
        document.body.classList.add("richtig");

        const jubel = document.createElement("p");
        jubel.className = "yippie";
        jubel.textContent = "YIPPIE";

        const erfolgstext = document.createElement("p");
        erfolgstext.className = "erfolgstext";
        erfolgstext.textContent = aktuellesRaetsel.erfolgstext;

        meldung.append(jubel, erfolgstext);
      } else {
        document.body.classList.add("falsch");
        meldung.textContent =
          "Das ist leider noch nicht richtig. Versuch es noch einmal!";

        antwortFeld.focus();
        antwortFeld.select();
      }
    });

    zurueck.addEventListener("click", function () {
      farbenZuruecksetzen();
      bereich.hidden = true;

      if (letztesTuerchen) {
        letztesTuerchen.focus();
      }
    });
  </script>
</body>
</html>
