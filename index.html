<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advent in Steglitz – Türchen 2</title>

  <style>
    :root {
      --nachtblau: #0a1c38;
      --creme: #fff9ef;
      --rot: #e94d62;
      --gold: #f3c65e;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      padding: 2rem 1rem;
      text-align: center;
      font-family: system-ui, sans-serif;
      background: var(--nachtblau);
      color: var(--creme);
    }

    main {
      max-width: 30rem;
      margin: auto;
    }

    h1 {
      margin-top: 0;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    .tuer {
      position: relative;
      display: block;
      width: min(100%, 17rem);
      aspect-ratio: 165 / 140;
      margin: 1.5rem auto;
      padding: 0;
      overflow: hidden;
      border: 0;
      background: var(--creme);
      cursor: pointer;
    }

    /* Zeigt nur den Ausschnitt mit der 2 aus dem Kalenderbild. */
    .tuer img {
      position: absolute;
      width: 498.79%;
      max-width: none;
      height: auto;
      left: -102.42%;
      top: -17.86%;
      pointer-events: none;
    }

    .raetsel {
      padding: 1.25rem;
      border: 3px solid var(--rot);
      border-radius: 1rem;
      background: var(--creme);
      color: var(--nachtblau);
    }

    h2 { margin-top: 0; }

    .aufgabe {
      font-size: clamp(1.25rem, 5.5vw, 1.8rem);
      font-weight: bold;
    }

    form {
      display: grid;
      gap: 0.65rem;
      max-width: 19rem;
      margin: auto;
    }

    input, .bestaetigen {
      width: 100%;
      min-height: 48px;
      padding: 0.65rem;
      border: 2px solid var(--nachtblau);
      border-radius: 0.5rem;
      font: inherit;
    }

    input { text-align: center; }

    .bestaetigen {
      background: var(--nachtblau);
      color: var(--creme);
      cursor: pointer;
    }

    #meldung:empty { margin: 0; }

    .stern {
      display: block;
      width: min(12rem, 100%);
      margin: 0.75rem auto 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>Advent in Steglitz</h1>
    <p>Tippe auf Türchen 2.</p>

    <button class="tuer" id="tuer2" type="button"
            aria-label="Türchen 2" aria-controls="raetsel2"
            aria-expanded="false">
      <img src="IMG_2285.jpeg" alt="">
    </button>

    <section class="raetsel" id="raetsel2" aria-labelledby="titel2" hidden>
      <h2 id="titel2">Türchen 2</h2>
      <p class="aufgabe">(9 − 5) × 7 + 6 × 4 = ?</p>

      <form id="formular2">
        <label for="ergebnis2">Dein Ergebnis</label>
        <input id="ergebnis2" type="text" inputmode="numeric"
               autocomplete="off" required>
        <button class="bestaetigen" type="submit">
          Ergebnis bestätigen
        </button>
      </form>

      <p id="meldung" role="status"></p>

      <svg id="stern2" class="stern" viewBox="0 0 100 100"
           role="img" aria-label="Goldener Stern mit dem Buchstaben S" hidden>
        <polygon points="50,4 63,34 96,37 71,59 79,92
                         50,75 21,92 29,59 4,37 37,34"
                 fill="#f3c65e" stroke="#a86d25" stroke-width="2"/>
        <text x="50" y="64" text-anchor="middle" fill="#0a1c38"
              font-size="38" font-weight="bold">S</text>
      </svg>
    </section>
  </main>

  <script>
    const tuer = document.getElementById("tuer2");
    const raetsel = document.getElementById("raetsel2");
    const formular = document.getElementById("formular2");
    const eingabe = document.getElementById("ergebnis2");
    const meldung = document.getElementById("meldung");
    const stern = document.getElementById("stern2");

    tuer.addEventListener("click", () => {
      raetsel.hidden = !raetsel.hidden;
      tuer.setAttribute("aria-expanded", String(!raetsel.hidden));
    });

    formular.addEventListener("submit", (event) => {
      event.preventDefault();

      if (eingabe.value.trim() === "52") {
        stern.removeAttribute("hidden");
        meldung.textContent = "Richtig! Dein Buchstabe ist S.";
      } else {
        stern.setAttribute("hidden", "");
        eingabe.value = "";
        meldung.textContent = "Noch nicht richtig. Versuch es noch einmal!";
        eingabe.focus();
      }
    });
  </script>
</body>
</html>
