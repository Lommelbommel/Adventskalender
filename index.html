<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adventskalender-Rätsel für Jori</title>

  <!-- Schriftarten -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Pacifico&display=swap"
    rel="stylesheet"
  >

  <style>
    /* FARBPALETTE */

    :root {
      --blau: #00345c;
      --pink: #ed2860;
      --rot: #f52232;
      --creme: #e8ddce;
      --beere: #a51e50;

      --richtig: #88e788;
      --falsch: #ff0000;
      --antwort-schrift: #511f1a;
    }

    /* ALLGEMEINES DESIGN */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 35px 20px;
      background-color: var(--blau);
      color: var(--creme);
      font-family: Arial, sans-serif;
      text-align: center;
      transition: background-color 0.4s, color 0.4s;
    }

    main {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 {
      margin: 10px 0 20px;
      color: var(--pink);
      font-family: "Pacifico", cursive;
      font-size: clamp(2.6rem, 7vw, 4.5rem);
      font-weight: bold;
      line-height: 1.5;
    }

    .einleitung {
      margin-bottom: 35px;
      color: var(--creme);
      font-family: "Oswald", sans-serif;
      font-size: 1.3rem;
      line-height: 1.6;
    }

    /* TÜRCHEN */

    .kalender {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .tuerchen {
      min-height: 130px;
      padding: 20px;
      border: 2px solid var(--pink);
      border-radius: 14px;
      background-color: var(--beere);
      color: var(--creme);
      font-family: "Oswald", sans-serif;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.25);
      transition:
        transform 0.2s,
        background-color 0.2s;
    }

    .tuerchen:hover {
      transform: translateY(-4px);
      background-color: var(--rot);
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 5px;
    }

    /* RÄTSELBEREICH */

    .raetselbereich {
      margin-top: 35px;
      padding: 28px 20px;
      border: 2px solid currentColor;
      border-radius: 18px;
      background-color: rgba(255, 255, 255, 0.08);
      scroll-margin-top: 20px;
    }

    .raetselbereich h2 {
      margin-top: 0;
    }

    #aufgabe {
      font-size: 1.5rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    /* EINGABEFELD FÜR RECHEN- ODER WORTRÄTSEL */

    label {
      display: block;
      margin: 22px 0 10px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 300px;
      margin: 0 auto 16px;
      padding: 13px;
      border: 2px solid var(--beere);
      border-radius: 8px;
      background-color: var(--creme);
      color: var(--blau);
      font-family: Arial, sans-serif;
      font-size: 1.2rem;
      text-align: center;
    }

    .knopf {
      padding: 12px 20px;
      border: 2px solid var(--beere);
      border-radius: 8px;
      background-color: var(--creme);
      color: var(--blau);
      font-family: Arial, sans-serif;
      font-size: 1rem;
      cursor: pointer;
    }

    /* ANTWORTAUSWAHL A, B UND C */

    .auswahl {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 25px auto 0;
      max-width: 750px;
    }

    .auswahlknopf {
      min-height: 110px;
      padding: 18px 12px;
      border: 2px solid var(--pink);
      border-radius: 12px;
      background-color: var(--creme);
      color: var(--blau);
      font-family: Arial, sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .auswahlknopf:hover {
      transform: translateY(-3px);
    }

    .auswahlbuchstabe {
      display: block;
      margin-bottom: 6px;
      font-size: 1.8rem;
      font-weight: bold;
    }

    .auswahlknopf[aria-pressed="true"] {
      border: 4px solid currentColor;
    }

    /* RÜCKMELDUNG */

    #meldung {
      margin-top: 24px;
      line-height: 1.6;
    }

    .yippie {
      margin: 10px 0;
      font-family: Arial, sans-serif;
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: bold;
    }

    .erfolgstext {
      font-size: 1.4rem;
    }

    .erklaerung {
      max-width: 650px;
      margin: 18px auto 0;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .zurueck {
      margin-top: 20px;
    }

    /* FARBEN NACH DER ANTWORTPRÜFUNG */

    body.richtig {
      background-color: var(--richtig);
      color: var(--antwort-schrift);
    }

    body.falsch {
      background-color: var(--falsch);
      color: var(--antwort-schrift);
    }

    body.richtig h1,
    body.falsch h1,
    body.richtig .einleitung,
    body.falsch .einleitung,
    body.richtig .tuerchen,
    body.falsch .tuerchen,
    body.richtig input,
    body.falsch input,
    body.richtig .knopf,
    body.falsch .knopf,
    body.richtig .auswahlknopf,
    body.falsch .auswahlknopf {
      color: var(--antwort-schrift);
    }

    /* HANDYANSICHT */

    @media (max-width: 600px) {
      .kalender {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .tuerchen {
        min-height: 105px;
      }

      .auswahl {
        grid-template-columns: 1fr;
      }

      .auswahlknopf {
        min-height: 85px;
      }
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main>
    <h1>Adventskalender-Rätsel für Jori</h1>

    <p class="einleitung">
      Wähle ein Türchen und löse das Rätsel dahinter!
    </p>

    <div class="kalender" id="kalender"></div>

    <section
      class="raetselbereich"
      id="raetselbereich"
      aria-labelledby="raetselTitel"
      hidden
    >
      <h2 id="raetselTitel" tabindex="-1"></h2>

      <p id="aufgabe"></p>

      <!-- Für Aufgaben mit freier Texteingabe -->
      <form id="antwortFormular" hidden>
        <label for="antwort">Deine Antwort:</label>

        <input
          type="text"
          id="antwort"
          placeholder="Antwort eingeben"
          autocomplete="off"
          required
        >

        <button class="knopf" type="submit">
          Antwort prüfen
        </button>
      </form>

      <!-- Für Aufgaben mit Antwortauswahl -->
      <div
        class="auswahl"
        id="auswahl"
        role="group"
        aria-label="Wähle eine Antwort"
        hidden
      ></div>

      <div id="meldung" role="status" aria-live="polite"></div>

      <button class="knopf zurueck" id="zurueck" type="button">
        Zurück zum Kalender
      </button>
    </section>
  </main>

  <script>
    /*
      HIER DEINE RÄTSEL EINTRAGEN.

      typ: "eingabe"
      Zeigt ein Feld zum Eintippen der Antwort.

      typ: "auswahl"
      Zeigt anklickbare Antwortmöglichkeiten.

      typ: "platzhalter"
      Zeigt zunächst nur den Aufgabentext.
    */

    const raetsel = {
      2: {
        typ: "eingabe",
        aufgabe: "(9 − 5) × 7 + 6 × 4 = ?",
        antwort: "52",
        erfolgstext:
          "Du darfst das Türchen mit dem Smiley öffnen."
      },

      4: {
        typ: "auswahl",
        aufgabe:
          "Wie viele handelsübliche 0,5-Liter-Bierdosen müsste man ungefähr aufeinanderstapeln, um die Höhe des Steglitzer Bierpinsels zu erreichen?\n\nRechne mit 17 cm pro Dose.",

        optionen: [
          {
            buchstabe: "A",
            text: "Etwa 180 Dosen"
          },
          {
            buchstabe: "B",
            text: "Etwa 280 Dosen"
          },
          {
            buchstabe: "C",
            text: "Etwa 420 Dosen"
          }
        ],

        antwort: "B",
        erfolgstext: "Du hast das Rätsel gelöst!",

        erklaerung:
          "Der Bierpinsel ist 47 Meter hoch. Bei angenommen 17 cm pro Dose wären das rund 276 Dosen – also ist B am nächsten dran."
      },

      6: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      8: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      10: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      12: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      14: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      16: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      18: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      20: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      22: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      },

      24: {
        typ: "platzhalter",
        aufgabe: "Hier wartet bald dein nächstes Rätsel!"
      }
    };

    /* AB HIER WERDEN DIE FUNKTIONEN GESTEUERT. */

    const kalender = document.getElementById("kalender");
    const bereich = document.getElementById("raetselbereich");
    const titel = document.getElementById("raetselTitel");
    const aufgabe = document.getElementById("aufgabe");
    const formular = document.getElementById("antwortFormular");
    const antwortFeld = document.getElementById("antwort");
    const auswahl = document.getElementById("auswahl");
    const meldung = document.getElementById("meldung");
    const zurueck = document.getElementById("zurueck");

    let aktuelleNummer = null;
    let letztesTuerchen = null;

    function farbenZuruecksetzen() {
      document.body.classList.remove("richtig", "falsch");
    }

    function normalisieren(text) {
      return String(text).trim().toLocaleLowerCase("de-DE");
    }

    /* TÜRCHEN ERSTELLEN */

    Object.keys(raetsel).forEach(function (nummer) {
      const knopf = document.createElement("button");

      knopf.type = "button";
      knopf.className = "tuerchen";
      knopf.textContent = nummer;

      knopf.setAttribute(
        "aria-label",
        "Türchen " + nummer + " öffnen"
      );

      knopf.addEventListener("click", function () {
        letztesTuerchen = knopf;
        tuerchenOeffnen(nummer);
      });

      kalender.appendChild(knopf);
    });

    /* TÜRCHEN ÖFFNEN */

    function tuerchenOeffnen(nummer) {
      aktuelleNummer = nummer;

      const aktuellesRaetsel = raetsel[nummer];

      farbenZuruecksetzen();

      titel.textContent = "Türchen " + nummer;
      aufgabe.textContent = aktuellesRaetsel.aufgabe;

      antwortFeld.value = "";
      meldung.replaceChildren();
      auswahl.replaceChildren();

      formular.hidden = true;
      auswahl.hidden = true;

      if (aktuellesRaetsel.typ === "eingabe") {
        formular.hidden = false;
      }

      if (aktuellesRaetsel.typ === "auswahl") {
        auswahl.hidden = false;

        aktuellesRaetsel.optionen.forEach(function (option) {
          const knopf = document.createElement("button");

          knopf.type = "button";
          knopf.className = "auswahlknopf";
          knopf.setAttribute("aria-pressed", "false");

          const buchstabe = document.createElement("span");
          buchstabe.className = "auswahlbuchstabe";
          buchstabe.textContent = option.buchstabe + ")";

          const text = document.createElement("span");
          text.textContent = option.text;

          knopf.append(buchstabe, text);

          knopf.addEventListener("click", function () {
            auswahl.querySelectorAll("button").forEach(
              function (andererKnopf) {
                andererKnopf.setAttribute(
                  "aria-pressed",
                  "false"
                );
              }
            );

            knopf.setAttribute("aria-pressed", "true");

            antwortPruefen(option.buchstabe);
          });

          auswahl.appendChild(knopf);
        });
      }

      bereich.hidden = false;

      bereich.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      titel.focus({ preventScroll: true });
    }

    /* ANTWORT PRÜFEN: FÜR BEIDE AUFGABENTYPEN */

    function antwortPruefen(eingabe) {
      const aktuellesRaetsel = raetsel[aktuelleNummer];

      farbenZuruecksetzen();
      meldung.replaceChildren();

      const istRichtig =
        normalisieren(eingabe) ===
        normalisieren(aktuellesRaetsel.antwort);

      if (istRichtig) {
        document.body.classList.add("richtig");

        const jubel = document.createElement("p");
        jubel.className = "yippie";
        jubel.textContent = "YIPPIE";

        const erfolgstext = document.createElement("p");
        erfolgstext.className = "erfolgstext";
        erfolgstext.textContent =
          aktuellesRaetsel.erfolgstext ||
          "Du hast das Rätsel gelöst!";

        meldung.append(jubel, erfolgstext);

        if (aktuellesRaetsel.erklaerung) {
          const erklaerung = document.createElement("p");

          erklaerung.className = "erklaerung";
          erklaerung.textContent =
            aktuellesRaetsel.erklaerung;

          meldung.appendChild(erklaerung);
        }
      } else {
        document.body.classList.add("falsch");

        meldung.textContent =
          "Das ist leider noch nicht richtig. Versuch es noch einmal!";

        if (aktuellesRaetsel.typ === "eingabe") {
          antwortFeld.focus();
          antwortFeld.select();
        }
      }
    }

    /* EINGABE PER KNOPFDRUCK ODER ENTER PRÜFEN */

    formular.addEventListener("submit", function (ereignis) {
      ereignis.preventDefault();
      antwortPruefen(antwortFeld.value);
    });

    /* ZURÜCK ZUM KALENDER */

    zurueck.addEventListener("click", function () {
      farbenZuruecksetzen();
      bereich.hidden = true;

      if (letztesTuerchen) {
        letztesTuerchen.focus();
      }
    });
  </script>
</body>
</html>
