<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Adventskalender-Rätsel für Jori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root {--blau:#00345c;--pink:#ed2860;--rot:#f52232;--creme:#e8ddce;--beere:#a51e50;--richtig:#88e788;--falsch:#ff0000;--antwort-schrift:#511f1a;}
* {box-sizing:border-box;}
body {margin:0;min-height:100vh;padding:35px 20px;background:var(--blau);color:var(--creme);font-family:Arial,sans-serif;text-align:center;transition:background-color .35s,color .35s;}
main {max-width:950px;margin:auto;}
h1 {margin:10px 0 20px;color:var(--pink);font-family:Pacifico,cursive;font-size:clamp(2.4rem,7vw,4.5rem);font-weight:bold;line-height:1.5;}
.einleitung {margin-bottom:35px;color:var(--creme);font-family:Oswald,sans-serif;font-size:1.3rem;line-height:1.6;}
button,input {font-family:Arial,sans-serif;} button {cursor:pointer;}
button:focus-visible,input:focus-visible {outline:3px solid var(--pink);outline-offset:5px;}
.kalender {display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.tuerchen {min-height:130px;padding:20px;border:2px solid var(--pink);border-radius:14px;background:var(--beere);color:var(--creme);font-family:Oswald,sans-serif;font-size:2.5rem;box-shadow:0 6px 0 #0004;transition:transform .2s,background-color .2s;}
.tuerchen:hover {transform:translateY(-4px);background:var(--rot);}
.raetselbereich,.loginbox {margin-top:35px;padding:28px 20px;border:2px solid currentColor;border-radius:18px;background:#ffffff14;scroll-margin-top:20px;}
.loginbox {max-width:550px;margin:35px auto;line-height:1.6;}
#raetselTitel {margin-top:0;font-size:1.7rem;}
#aufgabe {font-size:1.35rem;line-height:1.6;white-space:pre-line;}
.eingabe-label {display:block;margin:22px 0 10px;}
input {min-width:0;padding:13px;border:2px solid var(--beere);border-radius:8px;background:var(--creme);color:var(--blau);font-size:1.1rem;}
.einzel-eingabe {display:block;width:100%;max-width:420px;margin:0 auto 16px;text-align:center;}
.knopf {padding:12px 20px;border:2px solid var(--beere);border-radius:8px;background:var(--creme);color:var(--blau);font-size:1rem;}
.zurueck {margin-top:24px;}
.auswahl {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:750px;margin:25px auto 0;}
.auswahlknopf {min-height:105px;padding:18px 14px;border:2px solid var(--pink);border-radius:12px;background:var(--creme);color:var(--blau);font-size:1.1rem;line-height:1.5;transition:transform .2s;}
.auswahlknopf:hover {transform:translateY(-3px);}
.auswahlbuchstabe {display:block;margin-bottom:6px;font-size:1.6rem;font-weight:bold;}
.auswahlknopf[aria-pressed="true"] {outline:3px solid currentColor;outline-offset:-7px;}
.bewertung {grid-template-columns:repeat(5,minmax(0,1fr));}
.bewertung .auswahlknopf {min-height:85px;padding:12px;font-size:2rem;font-weight:bold;}
.mehrfach-liste {display:grid;gap:12px;max-width:650px;margin:25px auto;}
.eingabe-zeile {display:grid;grid-template-columns:45px minmax(0,1fr);align-items:center;gap:12px;text-align:left;}
.eingabe-zeile input {width:100%;}
.rechenliste {max-width:450px;}
.rechenliste .eingabe-zeile {grid-template-columns:100px minmax(0,1fr);}
.rechenliste label {font-size:1.3rem;}
input.feld-falsch {border:3px solid #a00000;background:#ffd0d0;color:#511f1a;}
input.feld-richtig {border:3px solid #236b2d;background:#d8f5d3;color:#511f1a;}
#meldung {margin-top:24px;line-height:1.6;}
.yippie {margin:10px 0;font-size:clamp(3rem,10vw,5rem);font-weight:bold;}
.erfolgstext {font-size:1.4rem;white-space:pre-line;}
.erklaerung {max-width:680px;margin:18px auto 0;font-size:1.15rem;line-height:1.7;}
#aufgabe.pause {max-width:650px;margin:25px auto;font-size:1.7rem;line-height:1.7;}
#loginFehler {color:#ffb9c8;min-height:1.6em;}
.abmelden {margin:30px 0 10px;}
body.richtig {background:var(--richtig);color:var(--antwort-schrift);}
body.falsch {background:var(--falsch);color:var(--antwort-schrift);}
body.richtig h1,body.falsch h1,body.richtig .einleitung,body.falsch .einleitung,body.richtig .tuerchen,body.falsch .tuerchen,body.richtig input,body.falsch input,body.richtig .knopf,body.falsch .knopf,body.richtig .auswahlknopf,body.falsch .auswahlknopf {color:var(--antwort-schrift);}
@media(max-width:600px){body{padding:25px 15px;}.kalender{grid-template-columns:repeat(2,1fr);gap:15px;}.tuerchen{min-height:105px;}.auswahl{grid-template-columns:1fr;}.bewertung{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}.bewertung .auswahlknopf{padding:8px;min-height:70px;}.raetselbereich{padding:24px 15px;}#aufgabe{font-size:1.2rem;}}
[hidden] {display:none!important;}
</style>
</head>
<body>
<main>
<h1>Adventskalender-Rätsel für Jori</h1>
<section class="loginbox" id="loginBereich" aria-labelledby="loginTitel">
<h2 id="loginTitel">Ein Passwort für deinen Adventskalender</h2>
<p>Gib das Passwort ein, um deinen Kalender zu öffnen.</p>
<form id="loginFormular">
<label class="eingabe-label" for="passwort">Passwort:</label>
<input class="einzel-eingabe" type="password" id="passwort" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
<button class="knopf" type="submit">Kalender öffnen</button>
</form>
<p id="loginFehler" role="status" aria-live="polite"></p>
</section>
<noscript><p>Bitte aktiviere JavaScript, um den Kalender zu verwenden.</p></noscript>
<div id="kalenderInhalt" hidden>
<p class="einleitung" id="kalenderStart" tabindex="-1">Wähle ein Türchen und löse das Rätsel dahinter!</p>
<div class="kalender" id="kalender"></div>
<section class="raetselbereich" id="raetselbereich" aria-labelledby="raetselTitel" hidden>
<h2 id="raetselTitel" tabindex="-1"></h2>
<p id="aufgabe"></p>
<div id="interaktion"></div>
<div id="meldung" role="status" aria-live="polite" aria-atomic="true"></div>
<button class="knopf zurueck" id="zurueck" type="button">Zurück zum Kalender</button>
</section>
<button class="knopf abmelden" id="abmelden" type="button">Kalender wieder schließen</button>
</div>
</main>
<script>
/* ACHTUNG: Dies ist nur eine einfache Zugangshürde im Browser.
   Passwort, Rätsel und Lösungen sind im Quelltext sichtbar.
   Dies ist KEIN sicherer Passwortschutz für vertrauliche Inhalte. */
const PASSWORT = "Adventadventeinlichtleinbrennt";

/* Deine Rätsel: Hier kannst du später Texte ändern. */
const raetsel = {

    "optionen": [
      "Etwa 180 Dosen",
      "Etwa 280 Dosen",
      "Etwa 420 Dosen"
    ],
    "richtig": 1,

    "erklaerung": "Der Bierpinsel ist 47 Meter hoch. Bei angenommen 17 cm pro Dose wären das rund 276 Dosen – also ist B am nächsten dran."
  },
  "6": {
    "typ": "auswahl",
    "aufgabe": "Steglitz – was wurde hier gegründet?\n\nFür welche Universität fand 1948 im Titania-Palast die Gründungsveranstaltung statt?",
    "optionen": [
      "Humboldt-Universität",
      "Technische Universität Berlin",
      "Freie Universität Berlin",
      "Universität der Künste Berlin"
    ],
    "richtig": 2,
    "erfolgstext": "Du darfst das Geschenk mit den Worten „Ach, diese Lücke, diese entsetzliche Lücke“ öffnen."
  },
  "8": {
    "typ": "eingabe",
    "aufgabe": "Schreibe die 7er-Malfolge von 1 × 7 bis 10 × 7 auf.\n\nOhne Komma und Leerzeichen.",
    "antworten": [
      "7142128354249566370"
    ],
    "erfolgstext": "Du darfst das Geschenk mit „7x7=feiner Sand“ öffnen."
  },
  "10": {
    "typ": "mehrfach",
    "aufgabe": "Wie heißen die Stationen der U9 von Walther-Schreiber-Platz bis Westhafen?\n\nTrage alle zwölf Stationen in der richtigen Reihenfolge ein und klicke auf „Bestätigen“.",
    "felder": [
      {
        "label": "1.",
        "antworten": [
          "Walther-Schreiber-Platz"
        ]

      {
        "label": "2.",

      },
      {
        "label": "4.",
        "antworten": [
          "Berliner Straße"
        ]
      },
      {
        "label": "5.",
        "antworten": [
          "Güntzelstraße"
        ]
      },
      {
        "label": "6.",
        "antworten": [
          "Spichernstraße"
        ]
      },
      {
        "label": "7.",
        "antworten": [
          "Kurfürstendamm"
        ]
      },
      {
        "label": "8.",

      },

      {

          "Turmstraße"
        ]
      },
      {
        "label": "11.",
        "antworten": [
          "Birkenstraße"
        ]
      },
      {
        "label": "12.",
        "antworten": [
          "Westhafen"
        ]
      }
    ],
    "erfolgstext": "Du darfst das Geschenk mit dem Wort „U9“ öffnen."
  },
  "12": {
    "typ": "auswahl",
    "aufgabe": "Was sorgte auf einer der ersten kommerziellen Weihnachtskarten von 1843 für Empörung?",
    "optionen": [
      "Der Weihnachtsmann trug keine Hose.",
      "Kinder wurden beim Weintrinken dargestellt.",
      "Eine Kirche stand auf dem Kopf.",
      "Die Karte enthielt Werbung für Zahnersatz."
    ],

    "erfolgstext": "Du darfst das Geschenk mit der Weihnachtsmütze öffnen."

  "14": {
    "typ": "auswahl",

    "optionen": [

    "erklaerung": "Stegelitz. Im Zuge des Zusammenschlusses der Kolonie mit dem alten Dorf wurde daraus 1870 „Steglitz“. Ein „e“ blieb auf der Strecke."
  },
  "16": {

    "rechnen": true,
    "aufgabe": "Löse die sechs Rechenaufgaben.\n\nTrage alle Ergebnisse ein und klicke auf „Bestätigen“.",
    "felder": [
      {

          "30"

      },
      {

          "27"

      {

      {

    ],
    "erfolgstext": "Du darfst das Türchen mit der Katze öffnen."
  },
  "18": {
    "typ": "pause",
    "aufgabe": "Heute hast du dir mal eine Pause verdient.\n\nÖffne den Stern."
  },
  "20": {
    "typ": "auswahl",
    "aufgabe": "Wie viele Meter lang ist die Schlossstraße?",
    "optionen": [
      "1,9 Kilometer",
      "2,5 Kilometer",
      "2,1 Kilometer"
    ],
    "richtig": 2,
    "erfolgstext": "Du darfst das Türchen mit dem Wort „Schloss“ öffnen."
  },
  "22": {
    "typ": "eingabe",
    "aufgabe": "Welcher Wochentag war der 21.07.2026?",
    "antworten": [
      "Dienstag"
    ],
    "erfolgstext": "Du darfst das Geschenk mit der „21“ öffnen."
  },
  "24": {
    "typ": "bewertung",
    "aufgabe": "Bewerte das Quiz.\n\n1 ist schlecht und 5 ist superspitze.",
    "optionen": [
      "5",
      "5",
      "5",
      "5",
      "5"
    ],
    "richtig": 4,
    "erfolgstext": "Ist ja nur noch ein Türchen übrig."
  }
};

const kalender = document.getElementById('kalender');
const bereich = document.getElementById('raetselbereich');
const titel = document.getElementById('raetselTitel');
const aufgabe = document.getElementById('aufgabe');
const interaktion = document.getElementById('interaktion');
const meldung = document.getElementById('meldung');
const loginBereich = document.getElementById('loginBereich');
const kalenderInhalt = document.getElementById('kalenderInhalt');
const passwortFeld = document.getElementById('passwort');
let aktuelleNummer = null;
let letztesTuerchen = null;

/* Passwort bei jedem Neuladen erneut eingeben. */
document.getElementById('loginFormular').addEventListener('submit', function(e) {
  e.preventDefault();
  if (passwortFeld.value === PASSWORT) {
    loginBereich.hidden = true;
    kalenderInhalt.hidden = false;
    passwortFeld.value = '';
    document.getElementById('loginFehler').textContent = '';
    document.getElementById('kalenderStart').focus();
  } else {
    document.getElementById('loginFehler').textContent = 'Das Passwort ist noch nicht richtig. Versuch es noch einmal!';
    passwortFeld.focus();
    passwortFeld.select();
  }
});
document.getElementById('abmelden').addEventListener('click', function() {
  farbenZuruecksetzen();
  kalenderInhalt.hidden = true;
  bereich.hidden = true;
  loginBereich.hidden = false;
  interaktion.replaceChildren();
  meldung.replaceChildren();
  passwortFeld.value = '';
  passwortFeld.focus();
});

function farbenZuruecksetzen() {
  document.body.classList.remove('richtig', 'falsch');
}
function normalisieren(text) {
  return String(text).normalize('NFC').trim().toLocaleLowerCase('de-DE')
    .replace(/ß/g, 'ss').replace(/[‐‑‒–—−]/g, '-')
    .replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ');
}
function antwortIstRichtig(eingabe, antworten) {
  return antworten.some(a => normalisieren(eingabe) === normalisieren(a));
}
function knopfErstellen(text) {
  const knopf = document.createElement('button');
  knopf.type = 'submit'; knopf.className = 'knopf'; knopf.textContent = text;
  return knopf;
}
function erfolgAnzeigen(daten) {
  farbenZuruecksetzen();
  document.body.classList.add('richtig');
  meldung.replaceChildren();
  const jubel = document.createElement('p');
  jubel.className = 'yippie'; jubel.textContent = 'YIPPIE';
  const text = document.createElement('p');
  text.className = 'erfolgstext'; text.textContent = daten.erfolgstext;
  meldung.append(jubel, text);
  if (daten.erklaerung) {
    const p = document.createElement('p');
    p.className = 'erklaerung'; p.textContent = daten.erklaerung;
    meldung.appendChild(p);
  }
}
function fehlerAnzeigen(text) {
  farbenZuruecksetzen();
  document.body.classList.add('falsch');
  meldung.textContent = text || 'Das ist leider noch nicht richtig. Versuch es noch einmal!';
}
Object.keys(raetsel).forEach(function(nummer) {
  const knopf = document.createElement('button');
  knopf.type = 'button'; knopf.className = 'tuerchen'; knopf.textContent = nummer;
  knopf.setAttribute('aria-label', 'Türchen ' + nummer + ' öffnen');
  knopf.addEventListener('click', function() {
    letztesTuerchen = knopf;
    tuerchenOeffnen(nummer);
  });
  kalender.appendChild(knopf);
});
function tuerchenOeffnen(nummer) {
  aktuelleNummer = nummer;
  const daten = raetsel[nummer];
  farbenZuruecksetzen(); meldung.replaceChildren(); interaktion.replaceChildren();
  titel.textContent = 'Türchen ' + nummer;
  aufgabe.textContent = daten.aufgabe;
  aufgabe.className = daten.typ === 'pause' ? 'pause' : '';
  if (daten.typ === 'eingabe') texteingabeErstellen(daten);
  if (daten.typ === 'auswahl' || daten.typ === 'bewertung') auswahlErstellen(daten);
  if (daten.typ === 'mehrfach') mehrfachEingabeErstellen(daten);
  bereich.hidden = false;
  bereich.scrollIntoView({behavior:'smooth', block:'start'});
  titel.focus({preventScroll:true});
}
function texteingabeErstellen(daten) {
  const form = document.createElement('form');
  const label = document.createElement('label');
  label.className = 'eingabe-label'; label.htmlFor = 'einzelAntwort'; label.textContent = 'Deine Antwort:';
  const input = document.createElement('input');
  input.type = 'text'; input.id = 'einzelAntwort'; input.className = 'einzel-eingabe';
  input.placeholder = 'Antwort eingeben'; input.autocomplete = 'off'; input.required = true;
  form.append(label, input, knopfErstellen('Antwort prüfen'));
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (antwortIstRichtig(input.value, daten.antworten)) erfolgAnzeigen(daten);
    else { fehlerAnzeigen(); input.focus(); input.select(); }
  });
  interaktion.appendChild(form);
}
function auswahlErstellen(daten) {
  const box = document.createElement('div');
  box.className = 'auswahl' + (daten.typ === 'bewertung' ? ' bewertung' : '');
  box.setAttribute('role', 'group'); box.setAttribute('aria-label', 'Antwort auswählen');
  daten.optionen.forEach(function(option, index) {
    const knopf = document.createElement('button');
    knopf.type = 'button'; knopf.className = 'auswahlknopf'; knopf.setAttribute('aria-pressed', 'false');
    if (daten.typ === 'bewertung') {
      knopf.textContent = option;
      knopf.setAttribute('aria-label', '5 – Auswahlfeld ' + (index + 1));
    } else {
      const buchstabe = document.createElement('span');
      buchstabe.className = 'auswahlbuchstabe'; buchstabe.textContent = String.fromCharCode(65 + index) + ')';
      const text = document.createElement('span'); text.textContent = option;
      knopf.append(buchstabe, text);
    }
    knopf.addEventListener('click', function() {
      box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      knopf.setAttribute('aria-pressed', 'true');
      if (index === daten.richtig) erfolgAnzeigen(daten); else fehlerAnzeigen();
    });
    box.appendChild(knopf);
  });
  interaktion.appendChild(box);
}
function mehrfachEingabeErstellen(daten) {
  const form = document.createElement('form');
  const liste = document.createElement('div');
  liste.className = 'mehrfach-liste' + (daten.rechnen ? ' rechenliste' : '');
  const eingaben = [];
  daten.felder.forEach(function(feld, index) {
    const zeile = document.createElement('div'); zeile.className = 'eingabe-zeile';
    const id = 'tuer-' + aktuelleNummer + '-feld-' + index;
    const label = document.createElement('label'); label.htmlFor = id; label.textContent = feld.label;
    const input = document.createElement('input'); input.id = id; input.type = 'text';
    input.autocomplete = 'off'; input.required = true;
    input.placeholder = daten.rechnen ? 'Ergebnis' : 'Station ' + (index + 1);
    if (daten.rechnen) input.inputMode = 'numeric';
    input.addEventListener('input', function() {
      input.classList.remove('feld-falsch', 'feld-richtig');
      input.removeAttribute('aria-invalid');
    });
    eingaben.push(input); zeile.append(label, input); liste.appendChild(zeile);
  });
  form.append(liste, knopfErstellen('Bestätigen'));
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    let fehler = 0, erstesFalschesFeld = null;
    eingaben.forEach(function(input, index) {
      const richtig = antwortIstRichtig(input.value, daten.felder[index].antworten);
      input.classList.toggle('feld-richtig', richtig);
      input.classList.toggle('feld-falsch', !richtig);
      input.setAttribute('aria-invalid', String(!richtig));
      if (!richtig) { fehler++; if (!erstesFalschesFeld) erstesFalschesFeld = input; }
    });
    if (fehler === 0) erfolgAnzeigen(daten);
    else {
      fehlerAnzeigen(fehler === 1
        ? 'Ein Eintrag ist noch nicht richtig. Korrigiere das rot markierte Feld und klicke erneut auf „Bestätigen“.'
        : fehler + ' Einträge sind noch nicht richtig. Korrigiere die rot markierten Felder und klicke erneut auf „Bestätigen“.');
      erstesFalschesFeld.focus();
    }
  });
  interaktion.appendChild(form);
}
document.getElementById('zurueck').addEventListener('click', function() {
  farbenZuruecksetzen(); bereich.hidden = true;
  if (letztesTuerchen) letztesTuerchen.focus();
});
</script>
</body>
</html>
