<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Rätsel-Adventskalender</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f3e8;
      color: #173d34;
      max-width: 36rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    details {
      background: white;
      border: 1px solid #d8ded8;
      border-radius: 12px;
      padding: 1rem;
    }

    summary {
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Mein Rätsel-Adventskalender</h1>
  <p>Tippe auf ein Türchen und entdecke das Rätsel.</p>

  <details>
    <summary>Türchen 1</summary>
    <p>Was wird größer, je mehr man davon wegnimmt?</p>

    <details>
      <summary>Lösung anzeigen</summary>
      <p>Ein Loch.</p>
    </details>
  </details>
</body>
</html>
